services:
  - type: web
    name: leadfinder
    runtime: python
    plan: free
    buildCommand: echo "no dependencies"
    startCommand: python scraper.py
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: DASH_PASSWORD
        sync: false        # Render asks you for this value on first deploy
      - key: PYTHON_VERSION
        value: 3.12.4
